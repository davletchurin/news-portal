spring:
  application:
    name: news-portal
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    open-in-view: false
    generate-ddl: true
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/news_portal_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: news_portal_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS news_portal_schema
      connection-timeout: ${HIKARI_TIMEOUT:20000}